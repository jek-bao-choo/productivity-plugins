<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1540" viewBox="0 0 1000 1540" role="img" aria-label="Video editing pipeline: prerequisites, then starting-video-editing runs steps 0 to 6, ending with finishing-video">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .title { font-size: 28px; font-weight: 700; fill: #2B1A47; }
  .sub { font-size: 15px; fill: #5B5470; }
  .band { font-size: 13px; font-weight: 700; fill: #5B5470; letter-spacing: 1px; }
  .h { font-size: 16px; font-weight: 700; fill: #2B1A47; }
  .li { font-size: 14px; fill: #3D2F5C; }
  .lim { font-size: 13px; fill: #632CA6; }
  .name { font-size: 17px; font-weight: 700; fill: #2B1A47; }
  .job { font-size: 14px; fill: #5B5470; }
  .outp { font-size: 13px; fill: #632CA6; }
  .num { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
  .badge { font-size: 12px; font-weight: 700; }
  .orch { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
  .orchs { font-size: 14px; fill: #F1E6FF; }
  .rail { font-size: 12px; fill: #632CA6; }
  .leg { font-size: 13px; fill: #3D2F5C; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A7FA3"/></marker><marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#632CA6"/></marker></defs>
<rect width="1000" height="1540" fill="#FFFFFF"/>
<text x="40" y="50" class="sans title">Video editing pipeline</text>
<text x="40" y="76" class="sans sub">From an OBS screen recording to a delivered video, one skill per step, with the orchestrator in charge</text>
<rect x="40" y="96" width="920" height="214" rx="16" fill="#F6F4FA" stroke="#C2BCD6" stroke-width="1.5"/>
<text x="62" y="122" class="sans band">PREREQUISITES (SET UP ONCE)</text>
<rect x="62" y="136" width="280" height="160" rx="12" fill="#FFFFFF" stroke="#DCD7E8" stroke-width="1"/>
<text x="78" y="162" class="sans h">Screen recording</text>
<text x="78" y="186" class="sans li">OBS Studio, 5120x1440 canvas</text>
<text x="78" y="205" class="sans li">screen pane + camera pane</text>
<text x="78" y="224" class="sans li">HEVC Hybrid MP4, one mic track</text>
<text x="78" y="243" class="sans li">Say "set up OBS" to run:</text>
<text x="78" y="262" class="mono lim">configuring-obs-studio-</text>
<text x="78" y="281" class="mono lim">screen-recording</text>
<rect x="362" y="136" width="280" height="160" rx="12" fill="#FFFFFF" stroke="#DCD7E8" stroke-width="1"/>
<text x="378" y="162" class="sans h">Machine tools</text>
<text x="378" y="186" class="sans li">ffmpeg and ffprobe</text>
<text x="378" y="205" class="sans li">Node.js 22 or newer</text>
<text x="378" y="224" class="sans li">Python 3 and jq</text>
<text x="378" y="243" class="sans li">Chrome or Chromium</text>
<text x="378" y="262" class="sans li">Claude Code</text>
<rect x="662" y="136" width="280" height="160" rx="12" fill="#FFFFFF" stroke="#DCD7E8" stroke-width="1"/>
<text x="678" y="162" class="sans h">Agent skills</text>
<text x="678" y="186" class="sans li">HyperFrames</text>
<text x="678" y="205" class="mono lim">hyperframes@hyperframes</text>
<text x="678" y="224" class="sans li">GSAP (gsap-skills)</text>
<text x="678" y="243" class="sans li">ElevenLabs skills</text>
<text x="678" y="262" class="mono lim">ELEVENLABS_API_KEY</text>
<text x="678" y="281" class="sans li">video-editing plugin</text>
<line x1="500" y1="310" x2="500" y2="336" stroke="#8A7FA3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="290" y="340" width="420" height="58" rx="12" fill="#FFFFFF" stroke="#8A7FA3" stroke-width="1.5"/>
<text x="500" y="364" text-anchor="middle" class="sans h"><tspan class="mono">raw.mp4</tspan> in its own project folder</text>
<text x="500" y="386" text-anchor="middle" class="sans li">then say "edit this video"</text>
<line x1="500" y1="398" x2="500" y2="424" stroke="#8A7FA3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="428" width="920" height="76" rx="14" fill="#632CA6"/>
<text x="500" y="460" text-anchor="middle" class="mono orch">starting-video-editing</text>
<text x="500" y="486" text-anchor="middle" class="sans orchs">Orchestrator: detects state from files, keeps PIPELINE.md (settings, decisions, approvals, md5s), auto_advance</text>
<rect x="110" y="540" width="820" height="96" rx="14" fill="#F8F3FE" stroke="#B98CEB" stroke-width="1.6"/>
<circle cx="152" cy="588" r="22" fill="#632CA6"/>
<text x="152" y="594" text-anchor="middle" class="sans num">0</text>
<text x="190" y="572" class="mono name">converting-speech-to-text-elevenlabs</text>
<text x="190" y="596" class="sans job">Transcribes the audio with ElevenLabs Scribe v2: word timestamps, fillers kept</text>
<text x="190" y="620" class="mono outp">→ transcript.json, transcript.raw.json</text>
<rect x="806" y="554" width="108" height="24" rx="12" fill="#FFFFFF" stroke="#E08A00" stroke-width="1.4"/>
<text x="860" y="570.5" text-anchor="middle" class="sans badge" fill="#8A4F00">paid call</text>
<line x1="520" y1="636" x2="520" y2="662" stroke="#8A7FA3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="666" width="820" height="96" rx="14" fill="#F8F3FE" stroke="#B98CEB" stroke-width="1.6"/>
<circle cx="152" cy="714" r="22" fill="#632CA6"/>
<text x="152" y="720" text-anchor="middle" class="sans num">1</text>
<text x="190" y="698" class="mono name">cutting-silences</text>
<text x="190" y="722" class="sans job">Trims pauses, renders, checks lip sync and render quality</text>
<text x="190" y="746" class="mono outp">→ raw.silenced.mp4, raw.silence-edl.json, raw.silence-transcript.json</text>
<rect x="806" y="680" width="108" height="24" rx="12" fill="#FFB454" stroke="#FFB454" stroke-width="1.4"/>
<text x="860" y="696.5" text-anchor="middle" class="sans badge" fill="#4A2E00">you review</text>
<line x1="520" y1="762" x2="520" y2="788" stroke="#8A7FA3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="792" width="820" height="96" rx="14" fill="#F8F3FE" stroke="#B98CEB" stroke-width="1.6"/>
<circle cx="152" cy="840" r="22" fill="#632CA6"/>
<text x="152" y="846" text-anchor="middle" class="sans num">2</text>
<text x="190" y="824" class="mono name">cutting-mistakes</text>
<text x="190" y="848" class="sans job">Proposes stutters, retakes and false starts; cuts only what you approve</text>
<text x="190" y="872" class="mono outp">→ raw.clean.mp4, raw.mistakes-transcript.json (or zero cuts)</text>
<rect x="806" y="806" width="108" height="24" rx="12" fill="#FFB454" stroke="#FFB454" stroke-width="1.4"/>
<text x="860" y="822.5" text-anchor="middle" class="sans badge" fill="#4A2E00">you review</text>
<line x1="520" y1="888" x2="520" y2="914" stroke="#8A7FA3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="918" width="820" height="96" rx="14" fill="#F8F3FE" stroke="#B98CEB" stroke-width="1.6"/>
<circle cx="152" cy="966" r="22" fill="#632CA6"/>
<text x="152" y="972" text-anchor="middle" class="sans num">3</text>
<text x="190" y="950" class="mono name">planning-storytelling</text>
<text x="190" y="974" class="sans job">Plans the visual story: one world, camera windows, open loop, beat sheet</text>
<text x="190" y="998" class="mono outp">→ plan/STORY.md, plan/DESIGN.md, plan/beat-sheet.json</text>
<rect x="806" y="932" width="108" height="24" rx="12" fill="#ECE7F5" stroke="#C2BCD6" stroke-width="1.4"/>
<text x="860" y="948.5" text-anchor="middle" class="sans badge" fill="#3D2F5C">you decide</text>
<line x1="520" y1="1014" x2="520" y2="1040" stroke="#8A7FA3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="1044" width="820" height="96" rx="14" fill="#FFFFFF" stroke="#B98CEB" stroke-width="1.6" stroke-dasharray="7 5"/>
<circle cx="152" cy="1092" r="22" fill="#632CA6"/>
<text x="152" y="1098" text-anchor="middle" class="sans num">4</text>
<text x="190" y="1076" class="mono name">planning-overlays</text>
<text x="190" y="1100" class="sans job">Plans lower-third cards and takeovers on top of the story</text>
<text x="190" y="1124" class="mono outp">→ plan/overlay-beats.json, plan/OVERLAYS.md</text>
<rect x="806" y="1058" width="108" height="24" rx="12" fill="#FFFFFF" stroke="#8A7FA3" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="860" y="1074.5" text-anchor="middle" class="sans badge" fill="#5B5470">optional</text>
<rect x="806" y="1088" width="108" height="24" rx="12" fill="#ECE7F5" stroke="#C2BCD6" stroke-width="1.4"/>
<text x="860" y="1104.5" text-anchor="middle" class="sans badge" fill="#3D2F5C">you decide</text>
<line x1="520" y1="1140" x2="520" y2="1166" stroke="#8A7FA3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="1170" width="820" height="96" rx="14" fill="#F8F3FE" stroke="#B98CEB" stroke-width="1.6"/>
<circle cx="152" cy="1218" r="22" fill="#632CA6"/>
<text x="152" y="1224" text-anchor="middle" class="sans num">5</text>
<text x="190" y="1202" class="mono name">building-sections</text>
<text x="190" y="1226" class="sans job">Builds one section in HyperFrames + GSAP, renders, reviews it</text>
<text x="190" y="1250" class="mono outp">→ film/, reviews/build/, film/REVIEW.md "&lt;section&gt;: approved"</text>
<rect x="806" y="1184" width="108" height="24" rx="12" fill="#FFB454" stroke="#FFB454" stroke-width="1.4"/>
<text x="860" y="1200.5" text-anchor="middle" class="sans badge" fill="#4A2E00">you review</text>
<rect x="806" y="1214" width="108" height="24" rx="12" fill="#F1E6FF" stroke="#D3A6FF" stroke-width="1.4"/>
<text x="860" y="1230.5" text-anchor="middle" class="sans badge" fill="#632CA6">per section</text>
<path d="M930,1244 C978,1244 978,1192 930,1192" fill="none" stroke="#632CA6" stroke-width="2" marker-end="url(#arrowp)"/>
<line x1="520" y1="1266" x2="520" y2="1292" stroke="#8A7FA3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="110" y="1296" width="820" height="96" rx="14" fill="#F8F3FE" stroke="#B98CEB" stroke-width="1.6"/>
<circle cx="152" cy="1344" r="22" fill="#632CA6"/>
<text x="152" y="1350" text-anchor="middle" class="sans num">6</text>
<text x="190" y="1328" class="mono name">finishing-video</text>
<text x="190" y="1352" class="sans job">Assembles every section, Studio check, draft QA, final render</text>
<text x="190" y="1376" class="mono outp">→ renders/final-v&lt;N&gt;.mp4, deliver/ (VERIFY.md, captions.srt/.vtt)</text>
<rect x="806" y="1310" width="108" height="24" rx="12" fill="#FFB454" stroke="#FFB454" stroke-width="1.4"/>
<text x="860" y="1326.5" text-anchor="middle" class="sans badge" fill="#4A2E00">you review</text>
<line x1="72" y1="504" x2="72" y2="1344.0" stroke="#D3A6FF" stroke-width="4" stroke-linecap="round"/>
<line x1="72" y1="588.0" x2="106" y2="588.0" stroke="#D3A6FF" stroke-width="3" marker-end="url(#arrowp)"/>
<circle cx="72" cy="588.0" r="5" fill="#632CA6"/>
<line x1="72" y1="714.0" x2="106" y2="714.0" stroke="#D3A6FF" stroke-width="3" marker-end="url(#arrowp)"/>
<circle cx="72" cy="714.0" r="5" fill="#632CA6"/>
<line x1="72" y1="840.0" x2="106" y2="840.0" stroke="#D3A6FF" stroke-width="3" marker-end="url(#arrowp)"/>
<circle cx="72" cy="840.0" r="5" fill="#632CA6"/>
<line x1="72" y1="966.0" x2="106" y2="966.0" stroke="#D3A6FF" stroke-width="3" marker-end="url(#arrowp)"/>
<circle cx="72" cy="966.0" r="5" fill="#632CA6"/>
<line x1="72" y1="1092.0" x2="106" y2="1092.0" stroke="#D3A6FF" stroke-width="3" marker-end="url(#arrowp)"/>
<circle cx="72" cy="1092.0" r="5" fill="#632CA6"/>
<line x1="72" y1="1218.0" x2="106" y2="1218.0" stroke="#D3A6FF" stroke-width="3" marker-end="url(#arrowp)"/>
<circle cx="72" cy="1218.0" r="5" fill="#632CA6"/>
<line x1="72" y1="1344.0" x2="106" y2="1344.0" stroke="#D3A6FF" stroke-width="3" marker-end="url(#arrowp)"/>
<circle cx="72" cy="1344.0" r="5" fill="#632CA6"/>
<text x="58" y="924.0" text-anchor="middle" transform="rotate(-90 58 924.0)" class="sans rail">runs each step, records results in PIPELINE.md</text>
<rect x="40" y="1428" width="920" height="100" rx="12" fill="#F6F4FA" stroke="#DCD7E8" stroke-width="1"/>
<rect x="62" y="1449" width="30" height="22" rx="6" fill="#F8F3FE" stroke="#B98CEB" stroke-width="1.6"/>
<text x="102" y="1465" class="sans leg">required step</text>
<rect x="232" y="1449" width="30" height="22" rx="6" fill="#FFFFFF" stroke="#B98CEB" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="272" y="1465" class="sans leg">optional step</text>
<path d="M402,1469 C430,1469 430,1451 402,1451" fill="none" stroke="#632CA6" stroke-width="2" marker-end="url(#arrowp)"/>
<text x="440" y="1465" class="sans leg">repeats once per section</text>
<rect x="62" y="1484" width="96" height="24" rx="12" fill="#FFB454" stroke="#FFB454" stroke-width="1.4"/>
<text x="110" y="1500.5" text-anchor="middle" class="sans badge" fill="#4A2E00">you review</text>
<text x="168" y="1501" class="sans leg">stops for you to watch or listen</text>
<rect x="400" y="1484" width="96" height="24" rx="12" fill="#ECE7F5" stroke="#C2BCD6" stroke-width="1.4"/>
<text x="448" y="1500.5" text-anchor="middle" class="sans badge" fill="#3D2F5C">you decide</text>
<text x="506" y="1501" class="sans leg">asks you to choose</text>
<rect x="660" y="1484" width="96" height="24" rx="12" fill="#FFFFFF" stroke="#E08A00" stroke-width="1.4"/>
<text x="708" y="1500.5" text-anchor="middle" class="sans badge" fill="#8A4F00">paid call</text>
<text x="766" y="1501" class="sans leg">costs money; asks first</text>
</svg>
